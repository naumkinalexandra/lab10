# Шаблон CI: сверьте синтаксис и executor с настройками Sourcecraft вашего курса.
name: mortgage-ml-ci
on:
  push:
  pull_request:
jobs:
  test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest -q
      - run: docker build -t mortgage-ml .
